<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0d12">
  <meta name="description" content="퍼리업 팀 대 팀 턴제 전투의 능력치, 행동 순서, 스킬과 계산식을 실험하는 시뮬레이터">
  <title>퍼리업 전투 실험실</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0d12'/%3E%3Cpath d='M16 45 28 15h8L24 45zm22-26h10L36 49H26z' fill='%23f1bd62'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="characters.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">F</span>
      <div><h1>퍼리업 전투 실험실</h1><p>턴제 밸런스 프로토타입</p></div>
    </div>
    <div class="topbar__meta"><span class="signal"></span> 규칙 세트 <b>α-02</b><span class="divider"></span><span id="seed-label">SEED 240914</span></div>
  </header>

  <main class="workspace">
    <section class="panel setup" aria-labelledby="setup-title">
      <div class="panel__head">
        <div><span class="eyebrow">01 · 편성</span><h2 id="setup-title">팀 구성</h2></div>
        <div class="team-switch" role="group" aria-label="편집할 팀"><button class="is-active" data-edit-team="A">A팀</button><button data-edit-team="B">B팀</button></div>
      </div>
      <div class="squads">
        <div><div class="squad-label"><b>A팀</b><span id="team-a-count">3 / 5</span></div><div id="team-a" class="slot-strip"></div></div>
        <div><div class="squad-label"><b>B팀</b><span id="team-b-count">3 / 5</span></div><div id="team-b" class="slot-strip"></div></div>
      </div>
      <div class="roster-tools"><label class="search"><span aria-hidden="true">⌕</span><input id="roster-search" type="search" placeholder="캐릭터 검색" aria-label="캐릭터 검색"></label><select id="role-filter" aria-label="역할군 필터"><option value="all">모든 역할</option><option>암살자</option><option>보호자</option><option>돌격자</option><option>결전자</option><option>교란자</option><option>추격자</option><option>치유자</option></select></div>
      <div id="roster" class="roster" aria-label="캐릭터 도감"></div>
      <p class="source-note"><a href="https://hk-rocketmonster.jetsomk22.workers.dev/" target="_blank" rel="noreferrer">로켓몬스터 도감</a> 42종 · 리메이크 문서의 기재 항목만 우선 반영</p>
    </section>

    <section class="panel arena" aria-labelledby="arena-title">
      <div class="arena__head"><div><span class="eyebrow">02 · 전투</span><h2 id="arena-title">시뮬레이션 보드</h2></div><div class="turn-readout"><span>TURN</span><strong id="turn-number">00</strong></div></div>
      <div class="queue-wrap"><span class="queue-label">다음 행동 순서</span><div id="action-queue" class="action-queue"></div></div>
      <div class="battlefield">
        <div class="battlefield__line battlefield__line--b"><span class="team-ribbon team-ribbon--b">B</span><div id="battle-team-b" class="fighters"></div></div>
        <div class="versus"><span></span><b>VS</b><span></span></div>
        <div class="battlefield__line battlefield__line--a"><span class="team-ribbon team-ribbon--a">A</span><div id="battle-team-a" class="fighters"></div></div>
      </div>
      <div class="transport" aria-label="전투 재생 제어">
        <button id="reset-button" class="icon-button" type="button" aria-label="전투 초기화">↺</button>
        <button id="step-button" class="icon-button" type="button" aria-label="한 행동 진행">▸│</button>
        <button id="start-button" class="primary-button" type="button"><span>▶</span> 전투 시작</button>
        <label class="speed-control">배속<select id="speed-select"><option value="1">×1</option><option value="2">×2</option><option value="4">×4</option></select></label>
      </div>
    </section>

    <aside class="panel analysis" aria-labelledby="analysis-title">
      <div class="panel__head"><div><span class="eyebrow">03 · 분석</span><h2 id="analysis-title">실험 설정</h2></div><button id="rules-button" class="ghost-button" type="button">규칙표</button></div>
      <div class="formula-card">
        <div class="formula-card__title"><span>현재 피해식</span><button type="button" id="formula-toggle" aria-expanded="false">펼치기</button></div>
        <code>max(<b id="min-damage-label">1</b>, ⌊공격력 × <b id="atk-factor-label">2</b> − 방어력⌋)</code>
        <div id="formula-fields" class="formula-grid" hidden>
          <label>HP 배수<input id="hp-multiplier" data-setting="hpMultiplier" type="number" value="10" min="1" max="100"></label>
          <label>공격 계수<input id="attack-factor" data-setting="attackFactor" type="number" value="2" min="0.1" max="10" step="0.1"></label>
          <label>최소 피해<input data-setting="minDamage" type="number" value="1" min="0" max="999"></label>
          <label>미정 스킬 피해<input id="skill-damage" data-setting="skillDamage" type="number" value="2" min="0" max="999"></label>
          <label>미정 스킬 비용<input id="skill-cost" data-setting="skillCost" type="number" value="3" min="1" max="99"></label>
          <label>투지 획득<input data-setting="gritGain" type="number" value="1" min="0" max="99"></label>
          <label>회피 확률 %<input data-setting="dodgeRate" type="number" value="15" min="0" max="100"></label>
          <label>최대 턴<input data-setting="maxTurns" type="number" value="100" min="1" max="1000"></label>
          <label class="formula-grid__wide">난수 시드<input data-setting="seed" type="number" value="240914" min="0" max="2147483647"></label>
          <label class="check-row formula-grid__wide"><input data-setting="enforceStatCap" type="checkbox"> 기본 스탯 합계 25 제한</label>
        </div>
      </div>
      <div class="analysis-tabs" role="tablist"><button class="is-active" data-analysis-tab="log" role="tab" aria-selected="true">전투 로그</button><button data-analysis-tab="results" role="tab" aria-selected="false">결과 요약</button></div>
      <div id="battle-log" class="battle-log" role="log" aria-live="off"><div class="log-entry log-entry--system"><span>준비</span><p>편성을 확인하고 전투를 시작하세요.</p></div></div>
      <div class="legend"><span><i class="dot dot--a"></i>A팀</span><span><i class="dot dot--b"></i>B팀</span><span><i class="dot dot--skill"></i>스킬·상태 효과</span></div>
    </aside>
  </main>

  <dialog id="editor-dialog" class="editor-dialog"><form method="dialog"><button class="dialog-close" value="cancel" aria-label="닫기">×</button><div id="editor-content"></div></form></dialog>
  <dialog id="rules-dialog" class="rules-dialog"><form method="dialog"><button class="dialog-close" value="cancel" aria-label="닫기">×</button><span class="eyebrow">RULE SET · α-02</span><h2>현재 전투 규칙</h2><div id="rules-content"></div></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
